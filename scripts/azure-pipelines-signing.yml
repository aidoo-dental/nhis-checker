# Run from the reviewed Azure Repos signing branch with its committed approval.
trigger: none
pr: none
pool:
  vmImage: windows-2022
steps:
  - checkout: self
    persistCredentials: false
  - task: NodeTool@0
    inputs:
      versionSpec: 22.x
  - task: UseDotNet@2
    inputs:
      packageType: runtime
      version: 8.0.x
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      node scripts/verify-windows-payload.mjs
      $approval = Get-Content signing-approval.json -Raw | ConvertFrom-Json
      Expand-Archive artifact.zip artifact
      if ($approval.variant -eq 'webview2-preview') {
        Expand-Archive artifact/NHIS-Checker-Windows-WebView2-signing-payload.zip staging
        Move-Item staging/payload payload
        $bootstrapper = Get-AuthenticodeSignature -LiteralPath 'staging/MicrosoftEdgeWebview2Setup.exe'
        if ($bootstrapper.Status -ne 'Valid' -or $bootstrapper.SignerCertificate.Subject -notmatch '(^|, )O=Microsoft Corporation(,|$)' -or !$bootstrapper.TimeStamperCertificate) {
          throw 'Expected a valid, timestamped Microsoft WebView2 bootstrapper'
        }
        if (!(Test-Path 'payload/WebView2Loader.dll') -or (Test-Path 'payload/Qt6WebEngineCore.dll')) {
          throw 'Unexpected WebView2 payload'
        }
      } else {
        Expand-Archive artifact/NHIS-Checker-Windows-signing-payload.zip payload
      }
      if ((Get-Item 'payload/NHIS Checker.exe').VersionInfo.ProductVersion -ne $approval.version) { throw 'Unexpected version' }
    displayName: Verify approved GitHub artifact
    env:
      NHIS_GITHUB_TOKEN: $(nhisGithubReadToken)
  - pwsh: ./scripts/prepare-azure-tools.ps1 -Directory "$(Agent.TempDirectory)/nhis-sign-tools"
    displayName: Verify Microsoft signing tools
  - task: AzureCLI@2
    displayName: Sign Windows binaries and installer through Azure
    inputs:
      azureSubscription: AIDOO-ArtifactSigning
      scriptType: pscore
      scriptLocation: inlineScript
      addSpnToEnvironment: false
      useGlobalConfig: false
      visibleAzLogin: false
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        $env:NHIS_SIGNTOOL = '$(NHIS_SIGNTOOL)'
        $env:NHIS_DLIB = '$(NHIS_DLIB)'
        $env:NHIS_SIGNING_METADATA = (Resolve-Path 'scripts/azure-signing-metadata.json').Path
        $app = Get-Item 'payload/NHIS Checker.exe'
        ./scripts/sign-windows-azure.ps1 -Path $app.FullName
        $libraries = Get-ChildItem payload -Recurse -File |
          Where-Object { $_.Extension -in '.exe', '.dll' -and $_.FullName -ne $app.FullName }
        foreach ($binary in $libraries) {
          ./scripts/sign-windows-azure.ps1 -Path $binary.FullName -PreserveValid
        }
        $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
        if (!(Test-Path $iscc)) { throw 'Inno Setup 6 missing' }
        New-Item dist -ItemType Directory -Force | Out-Null
        $signCommand = 'pwsh.exe -NoProfile -File $q' + "$pwd/scripts/sign-windows-azure.ps1" + '$q -Path $f'
        $approval = Get-Content signing-approval.json -Raw | ConvertFrom-Json
        $installerArgs = @('/DSignWithAzure', "/Saidoo=$signCommand", "/DAppVersion=$($approval.version)", "/DPayloadDir=$pwd/payload", "/DOutputDir=$pwd/dist")
        if ($approval.variant -eq 'webview2-preview') {
          $installerArgs += "/DWebView2Bootstrapper=$pwd/staging/MicrosoftEdgeWebview2Setup.exe"
        }
        & $iscc @installerArgs scripts/windows-installer.iss
        if ($LASTEXITCODE -ne 0) { throw 'Signed installer creation failed' }
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      $approval = Get-Content signing-approval.json -Raw | ConvertFrom-Json
      $preview = $approval.variant -eq 'webview2-preview'
      $setup = (Get-ChildItem 'dist/*Setup.exe').FullName
      $installed = "$(Agent.TempDirectory)/NHIS Checker installed"
      $p = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$installed`"") -Wait -PassThru
      if ($p.ExitCode -ne 0) { throw "Installation failed: $($p.ExitCode)" }
      $aidoo = 'CN=Aidoo LTD, O=Aidoo LTD, L=Sofia, S=Sofia City, C=BG'
      $app = (Get-Item "$installed/NHIS Checker.exe").FullName
      $uninstaller = (Get-Item "$installed/unins000.exe").FullName
      $installedBinaries = Get-ChildItem $installed -Recurse -File |
        Where-Object { $_.Extension -in '.exe', '.dll' }
      $signatures = foreach ($path in @($setup) + $installedBinaries.FullName) {
        & '$(NHIS_SIGNTOOL)' verify /pa /all /tw $path | Out-Host
        $s = Get-AuthenticodeSignature -LiteralPath $path
        if ($s.Status -ne 'Valid') { throw "Invalid signature: $path" }
        if (($path -in $setup, $app, $uninstaller) -and ($s.SignerCertificate.Subject -cne $aidoo -or !$s.TimeStamperCertificate)) {
          throw "Expected a timestamped AIDOO signature: $path"
        }
        $name = if ($path -eq $setup) { [IO.Path]::GetFileName($path) } else { [IO.Path]::GetRelativePath($installed, $path) }
        @{file=$name;sha256=(Get-FileHash $path -Algorithm SHA256).Hash;publisher=$s.SignerCertificate.Subject;timestamp=$s.TimeStamperCertificate.Subject;status=$s.Status.ToString()}
      }
      $ui = if ($preview) { 'ON' } else { 'OFF' }
      node tests/windows-smoke.cjs $app $ui
      $p = Start-Process $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
      if ($p.ExitCode -ne 0 -or (Test-Path $app)) { throw 'Uninstall failed' }
      $variant = if ($preview) { 'webview2-preview' } else { 'release' }
      @{version=$approval.version;variant=$variant;sourceCommit=$approval.commit;payloadSha256=$approval.digest.Substring(7);githubRunId=$approval.runId;githubArtifactId=$approval.artifactId;signatures=$signatures;installedSmokeTest='passed';uninstall='passed'} | ConvertTo-Json -Depth 6 | Set-Content dist/windows-signing-report.json
      Copy-Item '$(Agent.TempDirectory)/nhis-sign-tools/tools.json' dist/signing-tools.json
    displayName: Verify signatures and test the installed application
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: dist
      artifact: NHIS-Checker-signed-Windows
