# Use a protected Azure Repos branch with a reviewed signing-approval.json.
trigger: none
pr: none
pool:
  vmImage: windows-2022
steps:
  - checkout: self
    persistCredentials: false
  - task: NodeTool@0
    inputs:
      versionSpec: 22.x
  - task: UseDotNet@2
    inputs:
      packageType: runtime
      version: 8.0.x
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      node scripts/verify-windows-payload.mjs
      $approval = Get-Content signing-approval.json -Raw | ConvertFrom-Json
      Expand-Archive artifact.zip artifact
      Move-Item artifact/NHIS-Checker-Windows-signing-payload.zip payload.zip
      Expand-Archive payload.zip payload
      if ((Get-Item 'payload/NHIS Checker.exe').VersionInfo.ProductVersion -ne $approval.version) { throw 'Unexpected version' }
    displayName: Verify approved GitHub artifact
    env:
      NHIS_GITHUB_TOKEN: $(nhisGithubReadToken)
  - pwsh: ./scripts/prepare-azure-tools.ps1 -Directory "$(Agent.TempDirectory)/nhis-sign-tools"
    displayName: Verify Microsoft signing tools
  - task: AzureCLI@2
    displayName: Sign application, uninstaller and installer through Azure
    inputs:
      azureSubscription: AIDOO-ArtifactSigning
      scriptType: pscore
      scriptLocation: inlineScript
      addSpnToEnvironment: false
      useGlobalConfig: false
      visibleAzLogin: false
      inlineScript: |
        $ErrorActionPreference = 'Stop'
        $env:NHIS_SIGNTOOL = '$(NHIS_SIGNTOOL)'
        $env:NHIS_DLIB = '$(NHIS_DLIB)'
        $env:NHIS_SIGNING_METADATA = (Resolve-Path 'scripts/azure-signing-metadata.json').Path
        ./scripts/sign-windows-azure.ps1 -Path "$pwd/payload/NHIS Checker.exe"
        $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
        if (!(Test-Path $iscc)) { throw 'Inno Setup 6 missing' }
        New-Item dist -ItemType Directory -Force | Out-Null
        $signCommand = 'pwsh.exe -NoProfile -File $q' + "$pwd/scripts/sign-windows-azure.ps1" + '$q -Path $f'
        $version = (Get-Content signing-approval.json -Raw | ConvertFrom-Json).version
        & $iscc '/DSignWithAzure' "/Saidoo=$signCommand" "/DAppVersion=$version" "/DPayloadDir=$pwd/payload" "/DOutputDir=$pwd/dist" scripts/windows-installer.iss
        if ($LASTEXITCODE -ne 0) { throw 'Signed installer creation failed' }
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      $setup = (Get-ChildItem 'dist/*Setup.exe').FullName
      $installed = "$(Agent.TempDirectory)/NHIS Checker installed"
      $p = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$installed`"") -Wait -PassThru
      if ($p.ExitCode -ne 0) { throw "Installation failed: $($p.ExitCode)" }
      $signatures = foreach ($path in @($setup,"$installed/NHIS Checker.exe","$installed/unins000.exe")) {
        & '$(NHIS_SIGNTOOL)' verify /pa /all /v $path | Out-Host
        $s = Get-AuthenticodeSignature -LiteralPath $path
        if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -cne 'CN=Aidoo LTD, O=Aidoo LTD, L=Sofia, S=Sofia City, C=BG' -or !$s.TimeStamperCertificate) { throw 'Invalid AIDOO signature' }
        @{file=[IO.Path]::GetFileName($path);sha256=(Get-FileHash $path -Algorithm SHA256).Hash;publisher=$s.SignerCertificate.Subject;timestamp=$s.TimeStamperCertificate.Subject;status=$s.Status.ToString()}
      }
      node tests/windows-smoke.cjs "$installed/NHIS Checker.exe"
      $p = Start-Process "$installed/unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
      if ($p.ExitCode -ne 0 -or (Test-Path "$installed/NHIS Checker.exe")) { throw 'Uninstall failed' }
      $approval = Get-Content signing-approval.json -Raw | ConvertFrom-Json
      @{version=$approval.version;sourceCommit=$approval.commit;payloadSha256=$approval.digest.Substring(7);githubRunId=$approval.runId;githubArtifactId=$approval.artifactId;signatures=$signatures;installedSmokeTest='passed';uninstall='passed'} | ConvertTo-Json -Depth 6 | Set-Content dist/windows-signing-report.json
      Copy-Item '$(Agent.TempDirectory)/nhis-sign-tools/tools.json' dist/signing-tools.json
    displayName: Verify signatures and test the installed application
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: dist
      artifact: NHIS-Checker-signed-Windows
