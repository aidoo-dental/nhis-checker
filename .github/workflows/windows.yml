name: Windows installer
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/**', 'tests/**', 'scripts/**', 'CMakeLists.txt', '.github/workflows/windows.yml']
  push:
    branches: [main, prototype/windows-webview2]
    paths: ['app/**', 'tests/**', 'scripts/**', 'CMakeLists.txt', '.github/workflows/windows.yml']
permissions:
  contents: read
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/prototype/windows-webview2' }}
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      NHIS_WEBVIEW2_PREVIEW: ${{ github.ref == 'refs/heads/prototype/windows-webview2' && 'ON' || 'OFF' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check signing artifact verification
        run: node --test tests/verify-windows-payload.mjs
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          modules: ${{ env.NHIS_WEBVIEW2_PREVIEW == 'OFF' && 'qtwebengine qtwebchannel qtpositioning' || '' }}
          cache: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: microsoft/vcpkg
          ref: 7cc5ff8668babd02224d51af40d32f5e0b07868c
          path: .deps/vcpkg
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: deps-cache
        with:
          path: |
            .deps/vcpkg/installed
            .deps/openssl
          key: windows-x64-vcpkg-7cc5ff8-openssl-3.5.9-libxml2
      - name: Build dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & .deps/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          & .deps/vcpkg/vcpkg.exe install libxml2:x64-windows --recurse
          if (!(Test-Path .deps/openssl/bin/libcrypto-3-x64.dll)) {
            Invoke-WebRequest 'https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz' -OutFile .deps/openssl.tar.gz
            if ((Get-FileHash .deps/openssl.tar.gz -Algorithm SHA256).Hash -ne '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a') { throw 'OpenSSL checksum mismatch' }
            tar -xzf .deps/openssl.tar.gz -C .deps
            $prefix = Join-Path (Resolve-Path .deps).Path 'openssl'
            Push-Location .deps/openssl-3.5.9
            try {
              perl Configure VC-WIN64A no-asm "--prefix=$prefix" --libdir=lib
              nmake /nologo
              nmake /nologo install_sw
              New-Item "$prefix/share/openssl" -ItemType Directory -Force | Out-Null
              Copy-Item LICENSE.txt "$prefix/share/openssl/copyright"
            } finally { Pop-Location }
          }
          Invoke-WebRequest 'https://github.com/OpenSC/libp11/releases/download/libp11-0.4.18/libp11-0.4.18.tar.gz' -OutFile .deps/libp11.tar.gz
          if ((Get-FileHash .deps/libp11.tar.gz -Algorithm SHA256).Hash -ne '9292de67ca73aba1deacf577c9086b595765f36ef47712cfeb49fa31f6e772fb') { throw 'libp11 checksum mismatch' }
          tar -xzf .deps/libp11.tar.gz -C .deps
          $ssl = (Resolve-Path .deps/openssl).Path
          Push-Location .deps/libp11-0.4.18/src
          nmake /nologo /f Makefile.mak libp11.dll BUILD_FOR=WIN64 "OPENSSL_DIR=$ssl"
          Pop-Location
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.deps-cache.outputs.cache-hit != 'true'
        with:
          path: |
            .deps/vcpkg/installed
            .deps/openssl
          key: windows-x64-vcpkg-7cc5ff8-openssl-3.5.9-libxml2
      - name: Prepare Microsoft WebView2 SDK and bootstrapper
        if: env.NHIS_WEBVIEW2_PREVIEW == 'ON'
        run: |
          $sdk = 'https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.3967.48/microsoft.web.webview2.1.0.3967.48.nupkg'
          Invoke-WebRequest $sdk -OutFile .deps/webview2.zip
          if ((Get-FileHash .deps/webview2.zip -Algorithm SHA256).Hash -ne 'c66357ac7f324ec9bcafe5241706a023b4122d8c22300c31de4b0eb220db689e') { throw 'WebView2 SDK checksum mismatch' }
          Expand-Archive .deps/webview2.zip .deps/webview2
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile .deps/MicrosoftEdgeWebview2Setup.exe
      - name: Compile and test
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $deps = (Resolve-Path .deps/vcpkg/installed/x64-windows).Path
          $p11 = (Resolve-Path .deps/libp11-0.4.18/src).Path
          $ssl = (Resolve-Path .deps/openssl).Path
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR;$deps" "-DOPENSSL_ROOT_DIR=$ssl" "-DLIBP11_INCLUDE_DIR=$p11" "-DLIBP11_LIBRARY=$p11/libp11.lib" "-DNHIS_WEBVIEW2_PREVIEW=$env:NHIS_WEBVIEW2_PREVIEW" "-DWEBVIEW2_SDK_DIR=$PWD/.deps/webview2"
          cmake --build build-win
          $env:PATH = "$ssl/bin;$deps/bin;$p11;$env:PATH"
          ctest --test-dir build-win --output-on-failure
          $packageArgs = @{}
          if ($env:NHIS_WEBVIEW2_PREVIEW -eq 'ON') {
            $packageArgs.WebView2Bootstrapper = '.deps/MicrosoftEdgeWebview2Setup.exe'
          }
          ./scripts/package-windows.ps1 -BuildDir build-win -QtDir $env:QT_ROOT_DIR -DepsDir $deps -LibP11Dir .deps/libp11-0.4.18 -OpenSSLDir $ssl @packageArgs
      - name: Test installed app and uninstall
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $installer = (Get-ChildItem 'dist/*Setup.exe').FullName
          $install = Join-Path $env:RUNNER_TEMP 'NHIS Checker installed'
          $p = Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$install`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          node tests/windows-smoke.cjs "$install/NHIS Checker.exe" $env:NHIS_WEBVIEW2_PREVIEW
          $p = Start-Process "$install/unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($p.ExitCode -ne 0 -or (Test-Path "$install/NHIS Checker.exe")) { throw 'Uninstall failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: env.NHIS_WEBVIEW2_PREVIEW == 'ON'
        with:
          name: NHIS-Checker-Windows-WebView2-Preview
          retention-days: 3
          path: dist/*-WebView2-Preview-Setup.exe
          if-no-files-found: error
          compression-level: 0
      - name: Freeze payload for Azure signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: Compress-Archive -Path build-win/payload/* -DestinationPath dist/NHIS-Checker-Windows-signing-payload.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: NHIS-Checker-Windows-signing-payload
          retention-days: 3
          path: dist/NHIS-Checker-Windows-signing-payload.zip
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: Windows-diagnostics
          path: build-win/*.png
          if-no-files-found: ignore
